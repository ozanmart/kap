name: Validate KAP registry snapshot

on:
  push:
    paths:
      - "src/kap/data/bist_companies_general.json"
      - "src/kap/scrapers/listings.py"
      - "scripts/refresh_registry.py"
      - "tests/test_registry_snapshot.py"
  pull_request:
    paths:
      - "src/kap/data/bist_companies_general.json"
      - "src/kap/scrapers/listings.py"
      - "scripts/refresh_registry.py"
      - "tests/test_registry_snapshot.py"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q tests/test_registry_snapshot.py
      - name: Fetch and diff public registry on scheduled runs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python scripts/refresh_registry.py --output /tmp/bist_companies_general.json
          set +e
          diff -u src/kap/data/bist_companies_general.json /tmp/bist_companies_general.json > /tmp/registry.diff
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
      - name: Upload registry drift report
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: kap-registry-diff
          path: |
            /tmp/registry.diff
            /tmp/bist_companies_general.meta.json
